# ==========================================================
# Mini-DSH Profile: base (Headless Minimal)
# ==========================================================
# This profile only activates backend service plugins.
# No web server, no GUI.

- name: '@mini-dsh/plugin-greeter'
  config:
    greetingPrefix: "Hello from Headless Base Profile"

- name: '@mini-dsh/plugin-counter'
  config:
    initialCount: 100

- name: '@mini-dsh/plugin-task-runner'
  config:
    taskName: "Deploy Mini-DSH Headless Task"
    targetUser: "Agent Engineer"
    iterations: 3
    autoRun: true
    exitOnComplete: false
